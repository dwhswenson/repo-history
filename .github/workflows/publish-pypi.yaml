name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release source and version
        run: |
          test "$GITHUB_REPOSITORY" = dwhswenson/repo-history
          test "$GITHUB_REF_TYPE" = tag
          export EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          test -n "$EXPECTED_VERSION"
          test "$GITHUB_REF" = "refs/tags/v$EXPECTED_VERSION"
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if project["version"] != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("Tag version does not match pyproject.toml")
          PY
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.76.2
          environments: py312
          locked: true
          cache: false
      - name: Lint, format, test, and build distributions
        run: pixi run --locked -e py312 python-ci
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/repo-history/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
